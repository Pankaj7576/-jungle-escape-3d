<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10251d">
<title>Jungle Escape 3D — The Lost Temple</title>
</head>
<body>
<div id="app">
  <div id="hud" class="hidden">
    <div class="hud-left"><span>🏃 <b id="distance">0</b> m</span><span>🪙 <b id="coins">0</b></span></div>
    <button id="pause" class="glass icon-button" aria-label="Pause">Ⅱ</button>
  </div>
  <div id="overlay">
    <section class="panel">
      <div class="eyebrow">AN INDIAN JUNGLE ADVENTURE</div>
      <h1>JUNGLE ESCAPE <em>3D</em></h1>
      <h2>THE LOST TEMPLE</h2>
      <p id="intro">Run through forgotten stone temples, cross jungle rivers and escape the ancient guardian.</p>
      <div class="best">BEST DISTANCE <b id="best">0</b> m</div>
      <label class="quality-label" for="quality">GRAPHICS <select id="quality"><option value="low">Low</option><option value="medium">Balanced</option><option value="high">Super Smooth</option></select></label><button id="play" class="primary">START RUN</button>
      <p class="help">Swipe ← → to change lanes · Swipe ↑ to jump · Swipe ↓ to slide</p>
    </section>
  </div>
  <div id="touch-controls" class="hidden">
    <div><button data-action="left">◀</button><button data-action="right">▶</button></div>
    <div><button data-action="jump">▲</button><button data-action="slide">▼</button></div>
  </div>
  <div id="toast"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
