name: Unity Android APK (Unity Migration)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for key in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required secrets under Settings > Secrets and variables > Actions. Do not put license contents or passwords in repository files."
            exit 1
          fi
          echo "Required secret names are present. Values were not printed."

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityMigration
          targetPlatform: Android
          buildMethod: JungleEscape.EditorTools.AndroidBuild.Build
          allowDirtyBuild: true
          customParameters: -nographics

      - name: Verify APK output
        run: |
          test -s UnityMigration/Builds/Android/JungleEscape.apk
          sha256sum UnityMigration/Builds/Android/JungleEscape.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jungle-Escape-Unity-Android-APK
          path: UnityMigration/Builds/Android/JungleEscape.apk
          if-no-files-found: error
          retention-days: 14
