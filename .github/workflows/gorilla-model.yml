name: Prepare CC0 Gorilla Model

on:
  workflow_dispatch:
  push:
    branches:
      - unity-migration/phase-1
    paths:
      - 'UnityMigration/Blender/prepare_gorilla.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install Blender and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy curl
          blender --version
          python3 -c "import numpy; print(numpy.__version__)"

      - name: Patch Blender 5 FBX exporter compatibility issue
        run: |
          FBX_ADDON=$(find /usr/lib/blender -path '*/io_scene_fbx/__init__.py' | head -n 1)
          test -n "$FBX_ADDON"
          sudo python3 - "$FBX_ADDON" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          source = source.replace("self.use_space_transform",
                                  'getattr(self, "use_space_transform", False)')
          path.write_text(source)
          print("Patched", path)
          PY

      - name: Download CC0 light gorilla source
        run: |
          curl -L --fail --retry 3 https://grab3d.com/dl/gorilla/gorilla-light.fbx -o /tmp/gorilla-light.fbx
          test -s /tmp/gorilla-light.fbx

      - name: Decimate and export Unity FBX
        run: |
          GORILLA_SOURCE=/tmp/gorilla-light.fbx PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python UnityMigration/Blender/prepare_gorilla.py
          test -s UnityMigration/Assets/Characters/Guardian_Ape.fbx

      - name: Upload optimized guardian
        uses: actions/upload-artifact@v4
        with:
          name: Jungle-Escape-CC0-Guardian
          path: |
            UnityMigration/Assets/Characters/Guardian_Ape.fbx
            UnityMigration/Assets/Characters/Guardian_Ape_SOURCE.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit optimized guardian to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnityMigration/Assets/Characters/Guardian_Ape.fbx UnityMigration/Assets/Characters/Guardian_Ape_SOURCE.txt
          if git diff --cached --quiet; then
            echo "Guardian asset is already up to date."
            exit 0
          fi
          git commit -m "Import optimized CC0 gorilla guardian"
          git push origin "HEAD:${GITHUB_REF_NAME}"
