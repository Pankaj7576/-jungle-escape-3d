name: Convert Black Suit Hero FBX

on:
  workflow_dispatch:
  push:
    branches:
      - unity-migration/phase-1
    paths:
      - 'UnityMigration/Blender/convert_black_suit_to_fbx.py'

permissions:
  contents: write

concurrency:
  group: generated-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install Blender and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          python3 -c "import numpy; print(numpy.__version__)"

      - name: Patch Blender 5 FBX exporter compatibility issue
        run: |
          FBX_ADDON=$(find /usr/lib/blender -path '*/io_scene_fbx/__init__.py' | head -n 1)
          test -n "$FBX_ADDON"
          sudo python3 - "$FBX_ADDON" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          source = source.replace("self.use_space_transform",
                                  'getattr(self, "use_space_transform", False)')
          path.write_text(source)
          print("Patched", path)
          PY

      - name: Convert existing black-suit GLB
        run: |
          HERO_OUTPUT_DIR=/tmp/hero-generated PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python UnityMigration/Blender/convert_black_suit_to_fbx.py
          test -s /tmp/hero-generated/Explorer_BlackSuit.fbx
          test -s /tmp/hero-generated/Explorer_BlackSuit_SOURCE.txt
          cp -f /tmp/hero-generated/Explorer_BlackSuit.fbx /tmp/hero-generated/Explorer_BlackSuit_SOURCE.txt UnityMigration/Assets/Characters/

      - name: Upload converted hero
        uses: actions/upload-artifact@v4
        with:
          name: Jungle-Escape-Black-Suit-Hero
          path: |
            UnityMigration/Assets/Characters/Explorer_BlackSuit.fbx
            UnityMigration/Assets/Characters/Explorer_BlackSuit_SOURCE.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit hero FBX to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnityMigration/Assets/Characters/Explorer_BlackSuit.fbx UnityMigration/Assets/Characters/Explorer_BlackSuit_SOURCE.txt
          if git diff --cached --quiet; then
            echo "Hero FBX is already up to date."
            exit 0
          fi
          git commit -m "Convert existing black-suit hero to Unity FBX"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
