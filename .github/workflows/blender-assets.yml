name: Generate Blender Track Assets

on:
  workflow_dispatch:
  push:
    branches:
      - unity-migration/phase-1
    paths:
      - 'UnityMigration/Blender/generate_track_modules.py'

permissions:
  contents: write

concurrency:
  group: generated-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          python3 -c "import numpy; print(\"System NumPy\", numpy.__version__)"

      - name: Patch Blender 5 FBX exporter compatibility issue
        run: |
          FBX_ADDON=$(find /usr/lib/blender -path '*/io_scene_fbx/__init__.py' | head -n 1)
          test -n "$FBX_ADDON"
          sudo python3 - "$FBX_ADDON" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          source = source.replace("self.use_space_transform",
                                  'getattr(self, "use_space_transform", False)')
          path.write_text(source)
          print("Patched", path)
          PY
          grep -n 'getattr(self, "use_space_transform"' "$FBX_ADDON"

      - name: Generate modular bridge assets
        run: |
          TRACK_OUTPUT_DIR=/tmp/track-generated PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python UnityMigration/Blender/generate_track_modules.py
          count=$(find /tmp/track-generated -maxdepth 1 -name "*.fbx" | wc -l)
          echo "Generated $count FBX modules"
          test "$count" -eq 4
          mkdir -p UnityMigration/Assets/Environment/Generated
          cp -f /tmp/track-generated/* UnityMigration/Assets/Environment/Generated/

      - name: Upload generated bridge bundle
        uses: actions/upload-artifact@v4
        with:
          name: Jungle-Escape-Blender-Track-Assets
          path: UnityMigration/Assets/Environment/Generated/
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Unity modules to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnityMigration/Assets/Environment/Generated/
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "Generate modular Blender bridge assets"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
